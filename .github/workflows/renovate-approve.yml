# Reusable workflow that supports Renovate auto-merging the PRs we've opted in to. Renovate turns on GitHub's
# auto-merge and rebases the PRs onto main on each run, and GitHub does the merge. This approves the PRs and labels
# them `automerge`, and withdraws both if anyone else pushes to the branch.
#
# To pause auto-merging, follow "Pausing auto-merge" in README.md. Setting
# RENOVATE_AUTOMERGE_PAUSED to `true` only stops new approvals: PRs that are already approved still merge.
name: Auto-approve Renovate pull requests

on:
  workflow_call:
    inputs:
      renovate-actor:
        description: The account Renovate opens PRs as
        type: string
        required: false
        default: team-github-bot
      branch-prefix:
        description: The branch prefix Renovate uses
        type: string
        required: false
        default: renovate/

jobs:
  approve-pr-renovate:
    runs-on: ubuntu-latest
    # Only act on Renovate's own changes. Renovate only turns on GitHub's auto-merge when every package in the PR
    # allows it, so mixed groups are left for a human. Checking who turned it on means turning on auto-merge by hand
    # never gets a PR approved, even after Renovate pushes to it again.
    # Callers trigger on `auto_merge_enabled` (new PRs) and `synchronize` (Renovate's rebases).
    if: >-
      github.event_name == 'pull_request' &&
      vars.RENOVATE_AUTOMERGE_PAUSED != 'true' &&
      github.actor == inputs.renovate-actor &&
      startsWith(github.head_ref, inputs.branch-prefix) &&
      github.event.pull_request.auto_merge != null &&
      github.event.pull_request.auto_merge.enabled_by.login == inputs.renovate-actor
    permissions:
      pull-requests: write
    # No concurrency group: a cancelled duplicate run shows as a failed check on the PR, and Renovate treats any
    # failed check as a red branch. The steps below are safe to run more than once instead.
    steps:
      # Renovate can't approve its own PR, so main's required review would never be satisfied.
      - name: ✅ Approve renovate PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          # --slurp merges the pages into one array first; gh doesn't allow it with --jq, so pipe to jq.
          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate --slurp |
            jq '[add[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED" and .commit_id == env.HEAD_SHA)] | length')
          if [ "$approved" -gt 0 ]; then
            echo "Already approved at $HEAD_SHA"
          else
            gh pr review --approve "$PR_URL"
          fi

      # The label shows at a glance which PRs the bot has approved to auto-merge. Renovate doesn't add it, because
      # Renovate combines labels across a group, so a mixed group would get it without being auto-merged.
      # Labels added with GITHUB_TOKEN don't trigger other workflows, so this can't loop.
      - name: 🏷️ Label automerge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=automerge" --silent

  # The bot's approval only vouches for Renovate's own changes. If anyone else pushes, dismiss it so the PR needs a
  # human review like any other, rather than auto-merging what they pushed. Renovate stops updating a branch once
  # someone else has pushed to it, so nothing approves it again. Runs even while auto-merge is paused.
  dismiss-approval-renovate:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.actor != inputs.renovate-actor &&
      startsWith(github.head_ref, inputs.branch-prefix)
    permissions:
      pull-requests: write
    steps:
      - name: 🚫 Dismiss bot approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' |
          while read -r id; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews/$id/dismissals" \
              -f event=DISMISS -f message="Someone other than Renovate pushed to this branch, so it needs a human review."
            echo "Dismissed review $id"
          done

      # The PR is no longer approved to auto-merge, so the label would be misleading.
      - name: 🏷️ Remove automerge label
        if: contains(github.event.pull_request.labels.*.name, 'automerge')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/automerge" --silent
