# Reusable workflow that runs self-hosted Renovate against the calling repo, with the shared self-hosted options.
#
# The schedule/dispatch triggers run it on this repo too, to keep its pinned actions current. They don't pass
# configuration-file, so its default is repeated below.
name: Renovate update dependencies

on:
  workflow_call:
    inputs:
      configuration-file:
        description: Path to the repo's self-hosted Renovate config
        type: string
        required: false
        default: renovate-config.js
      dry-run:
        description: Run Renovate without creating branches or PRs
        type: boolean
        required: false
        default: false
    secrets:
      RENOVATE_GITHUB_TOKEN:
        required: true
  schedule:
    - cron: "0 3 * * *"
      timezone: Australia/Brisbane
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🤖 Run Renovate
        uses: renovatebot/github-action@1cd96b855fee0da6f230617e89dbff0e06ea393a # v46.3.5
        with:
          configurationFile: ${{ inputs.configuration-file || 'renovate-config.js' }}
          token: ${{ secrets.RENOVATE_GITHUB_TOKEN }}
          # The action otherwise runs the floating `44` tag, so every repo would pick up a new Renovate release on its
          # next run with no minimumReleaseAge. Renovate updates this, grouped with the validator's version.
          renovate-version: 44.115.13
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || null }}
          LOG_LEVEL: debug
