name: Validate Renovate config and workflows

on:
  pull_request:
    branches:
      - main
    paths:
      - "*.json5"
      - renovate-config.js
      - .github/workflows/validate-renovate-config.yml
      - .github/workflows/renovate.yml
      - .github/workflows/renovate-approve.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every repo picks up a change here on its next Renovate run, so catch invalid or deprecated config before it merges.
      # Renovate keeps this version in step with renovate-version in renovate.yml (see renovate-config.js).
      - name: ✅ Validate presets
        run: npx --yes --package renovate@44.115.13 -- renovate-config-validator --strict default.json5 github-action.json5 dotnet.json5

      - name: ✅ Validate this repo's config
        env:
          RENOVATE_CONFIG_FILE: renovate-config.js
        run: npx --yes --package renovate@44.115.13 -- renovate-config-validator --strict

      # The reusable workflows reach every repo at `main` too, so catch broken expressions and scripts before they merge.
      - name: ✅ Lint workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
